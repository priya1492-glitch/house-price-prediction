<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Illustration of houses on a hillside at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.6" stop-color="#1d4177"/>
      <stop offset="1" stop-color="#e8a33d" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.75">
    <circle cx="140" cy="90" r="2"/><circle cx="420" cy="60" r="1.6"/><circle cx="700" cy="120" r="2"/>
    <circle cx="980" cy="70" r="1.8"/><circle cx="1260" cy="110" r="2"/><circle cx="1500" cy="50" r="1.6"/>
    <circle cx="300" cy="170" r="1.4"/><circle cx="1120" cy="190" r="1.4"/>
  </g>
  <circle cx="1230" cy="210" r="46" fill="#f6d79a" opacity="0.9"/>

  <!-- distant hills -->
  <path d="M0 470 C200 400 380 430 560 455 C760 482 920 400 1120 420 C1320 440 1460 400 1600 430 L1600 700 L0 700 Z" fill="#17335f"/>
  <path d="M0 540 C220 490 420 520 640 540 C880 560 1040 500 1260 515 C1420 525 1520 505 1600 510 L1600 700 L0 700 Z" fill="#102a4f"/>

  <!-- house 1 -->
  <g transform="translate(910 380)">
    <rect x="0" y="70" width="200" height="130" fill="#e9eef6"/>
    <path d="M-16 74 L100 0 L216 74 Z" fill="#c8553d"/>
    <rect x="80" y="130" width="40" height="70" fill="#12305c"/>
    <rect x="22" y="102" width="38" height="38" fill="#f6d79a"/>
    <rect x="140" y="102" width="38" height="38" fill="#f6d79a"/>
    <rect x="150" y="-10" width="22" height="48" fill="#b24a35"/>
  </g>
  <!-- house 2 -->
  <g transform="translate(1250 430)">
    <rect x="0" y="60" width="170" height="110" fill="#d6dfec"/>
    <path d="M-14 64 L85 0 L184 64 Z" fill="#2a5290"/>
    <rect x="66" y="108" width="36" height="62" fill="#0b1f3a"/>
    <rect x="18" y="86" width="32" height="32" fill="#f6d79a"/>
    <rect x="120" y="86" width="32" height="32" fill="#f6d79a"/>
  </g>
  <!-- house 3 -->
  <g transform="translate(640 440)">
    <rect x="0" y="55" width="150" height="105" fill="#dfe6f1"/>
    <path d="M-12 58 L75 0 L162 58 Z" fill="#8a3a2c"/>
    <rect x="56" y="100" width="34" height="60" fill="#12305c"/>
    <rect x="14" y="80" width="28" height="28" fill="#f6d79a"/>
    <rect x="104" y="80" width="28" height="28" fill="#f6d79a"/>
  </g>

  <!-- trees -->
  <g fill="#0f3b3a">
    <circle cx="850" cy="560" r="34"/><rect x="846" y="560" width="8" height="50" fill="#3b2a1d"/>
    <circle cx="1190" cy="580" r="28"/><rect x="1186" y="580" width="8" height="40" fill="#3b2a1d"/>
    <circle cx="590" cy="585" r="30"/><rect x="586" y="585" width="8" height="42" fill="#3b2a1d"/>
    <circle cx="1480" cy="590" r="32"/><rect x="1476" y="590" width="8" height="44" fill="#3b2a1d"/>
  </g>

  <!-- foreground -->
  <path d="M0 610 C260 580 520 620 820 612 C1120 604 1340 580 1600 606 L1600 700 L0 700 Z" fill="#0b1f3a"/>
</svg>
